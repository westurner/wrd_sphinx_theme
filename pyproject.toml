[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wrd_sphinx_theme"
version = "0.1.6"
description = "A Sphinx theme based on sphinxjp.themes.basicstrap (Bootstrap)"
readme = "README.rst"
authors = [
    { name = "Wes Turner", email = "wes@wrd.nu" },
]
license = { text = "MIT license" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
]
keywords = ["wrd_sphinx_theme"]
urls = { Homepage = "https://github.com/westurner/wrd_sphinx_theme" }
dependencies = [
    "sphinxjp.themes.basicstrap",
]

[project.optional-dependencies]
dev = [
    "pip>=21.1",
    "bumpversion>=0.5.3",
    "wheel>=0.38.1",
    "watchdog>=0.9.0",
    "flake8>=3.5.0",
    "tox>=3.5.2",
    "coverage>=4.5.1",
    "Sphinx>=1.8.1",
    "twine>=1.12.1",
    "pytest>=3.8.2",
    "pytest-runner>=4.2",
]

[project.entry-points."sphinx.html_themes"]
wrd_sphinx_theme = "wrd_sphinx_theme"

[project.scripts]
sri = "wrd_sphinx_theme.sri:main"

[tool.setuptools]
packages = ["wrd_sphinx_theme"]
include-package-data = true
zip-safe = false
